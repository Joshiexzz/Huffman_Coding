<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman File Compression</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Global styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            max-width: 800px;
            width: 90%;
            margin: 20px;
            transition: all 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.5);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.1em;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Button Styles */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .file-input-wrapper, .download-button {
            position: relative;
            overflow: hidden;
        }

        .file-input-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-wrapper label, .download-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #4CAF50;
            color: white;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Poppins', sans-serif;
        }

        .file-input-wrapper label:hover, .download-button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .download-button {
            display: none;
        }

        /* Display Huffman codes section */
        #huffmanCodes {
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            max-width: 100%;
            margin: 30px auto 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: none;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
        }

        #huffmanCodes h3 {
            margin-bottom: 20px;
            color: #4CAF50;
            font-size: 1.5em;
        }

        #huffmanCodes p {
            margin: 5px 0;
            font-size: 1em;
        }

        .footer {
            margin-top: 40px;
            font-size: 1.2em;
            color: #fff;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .footer:hover {
            background-color: rgba(0, 0, 0, 0.8);
            transform: translateY(-5px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }

        .footer a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .footer a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #4CAF50;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .footer a:hover {
            color: #45a049;
        }

        .footer a:hover::after {
            transform: scaleX(1);
        }

        /* Loading indicator */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            p {
                font-size: 1em;
            }

            .file-input-wrapper label, .download-button {
                padding: 12px 24px;
                font-size: 1em;
            }

            .button-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Huffman File Compression</h1>
        <p>Upload a text file to compress using Huffman encoding.</p>

        <div class="button-container">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" />
                <label for="fileInput">Choose a file</label>
            </div>
            <button class="download-button" id="downloadButton">Download Decoded</button>
        </div>

        <div class="loader" id="loader"></div>

        <div id="huffmanCodes">
            <h3>Huffman Codes:</h3>
            <!-- Huffman codes will be displayed here -->
        </div>
    </div>

    <div class="footer">
        <p>Created with <span style="color: #ff4d4d;">❤️</span> by <a href="https://github.com/Joshiexzz" target="_blank">Abhinav Joshi</a></p>
    </div>

    <script src="huffman.js"></script>
    <script>
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        // The download button's functionality is now handled in the huffman.js file
    </script>
</body>
</html>
